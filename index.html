<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Scratchpad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @font-face {
        font-family: 'Frank the Architect';
        src: url('/fonts/frank-the-architect.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      .font-handwriting {
        font-family: 'Bradley Hand', 'Marker Felt', 'Comic Sans MS', cursive;
      }

      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f3f4f6; /* gray-100 */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Hide scrollbars for the infinite canvas feel */
      ::-webkit-scrollbar {
        display: none;
      }
      .no-select {
        user-select: none;
        -webkit-user-select: none;
      }
      
      /* Animations */
      @keyframes spaceEnter {
        from { opacity: 0; transform: scale(0.8); filter: blur(4px); }
        to { opacity: 1; transform: scale(1); filter: blur(0px); }
      }
      .animate-space-enter {
        animation: spaceEnter 0.4s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
        transform-origin: center center;
      }

      @keyframes modalEnter {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-modal-enter {
        animation: modalEnter 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Generating glow animation */
      @keyframes borderRotate {
        0% { --angle: 0deg; }
        100% { --angle: 360deg; }
      }
      @property --angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }
      .generating-glow {
        position: relative;
        z-index: 50;
      }
      .generating-glow::before {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: inherit;
        padding: 3px;
        background: conic-gradient(from var(--angle), #3b82f6, #8b5cf6, #ec4899, #3b82f6);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: borderRotate 2s linear infinite;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root" style="width: 100%; height: 100%;"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
