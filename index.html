<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Spatial (Alpha)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f3f4f6; /* gray-100 */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Hide scrollbars for the infinite canvas feel */
      ::-webkit-scrollbar {
        display: none;
      }
      .no-select {
        user-select: none;
        -webkit-user-select: none;
      }
      
      /* Animations */
      @keyframes spaceEnter {
        from { opacity: 0; transform: scale(0.8); filter: blur(4px); }
        to { opacity: 1; transform: scale(1); filter: blur(0px); }
      }
      .animate-space-enter {
        animation: spaceEnter 0.4s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
        transform-origin: center center;
      }

      @keyframes modalEnter {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-modal-enter {
        animation: modalEnter 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>

}

</head>

</html>
